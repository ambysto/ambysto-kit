# APS-23: publishes the Ambysto.Kit.License NuGet package to GitHub Packages, from windows-vX.Y.Z tags on main only.
# Tags are the owner's: the ruleset "windows-release-tags" lets only a repository admin create, move or delete them.
name: Windows release

on:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#windows-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not windows-vX.Y.Z"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The tagged commit is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Swift and .NET key sets are equal
        run: python -I scripts/check-key-sets.py

      - name: Build everything
        working-directory: windows
        run: dotnet build -c Release Ambysto.Kit.slnx

      # APS-24: only the license tests run here. The safety tests need the Windows test machine (a standard user in an
      # interactive session, removable, network and exFAT volumes, a cloud-files fixture); windows-latest runs as an
      # administrator in a service session, where the gate refuses by design. They run in the VM before every tag.
      - name: Test (license)
        working-directory: windows
        run: dotnet test -c Release --no-build tests/Ambysto.Kit.License.Tests/Ambysto.Kit.License.Tests.csproj

      - name: Pack
        working-directory: windows
        run: dotnet pack src/Ambysto.Kit.License/Ambysto.Kit.License.csproj -c Release -p:Version=${{ env.VERSION }} -o ../artifacts

      - name: Push to GitHub Packages
        # The exact file, not a wildcard: on Windows `dotnet nuget push "artifacts/*.nupkg"` finds no file
        # (windows-v0.1.0's run failed here; reproduced in the VM).
        run: dotnet nuget push "artifacts/Ambysto.Kit.License.${{ env.VERSION }}.nupkg" --source https://nuget.pkg.github.com/ambysto/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --no-symbols

# Publishes ONE already-released Windows Kit package version to nuget.org, rebuilt from its release tag, through NuGet Trusted
# Publishing (a short-lived key from GitHub's OIDC token; there is no API key or secret). It exists so that apps that depend on
# the Kit (Ambysto Lean, open source) build without a GitHub token. windows-release.yml still publishes to GitHub Packages and is
# not touched. Run by hand: gh workflow run windows-publish-nuget-org.yml -f tag=windows-v0.1.2 -f package=License
# The nuget.org Trusted Publishing policy names this file; renaming it breaks the policy.
name: Publish to nuget.org

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of the version to publish (windows-vX.Y.Z)
        required: true
        type: string
      package:
        description: Package to publish
        required: true
        type: choice
        options: [License, Safety, Process]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      PACKAGE: ${{ inputs.package }}
    steps:
      # Only versions that were released to GitHub Packages (windows-release.yml): a tag with the release form that was never
      # released (windows-v0.1.0) must not reach nuget.org, where a version cannot be deleted. Extend the list when another
      # released version is backfilled.
      - name: The tag and package are a released pair
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^windows-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG is not windows-vX.Y.Z"
            exit 1
          fi
          case "$PACKAGE $TAG" in
            "License windows-v0.1.2" | "License windows-v0.2.0" | "License windows-v0.3.0" \
            | "Safety windows-v0.2.0" | "Safety windows-v0.3.0" | "Process windows-v0.3.0") ;;
            *) echo "$PACKAGE at $TAG is not a released version"; exit 1 ;;
          esac
          echo "VERSION=${TAG#windows-v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      # The version goes into every build: the DLL inside the package carries it (assembly and file version), as in the released
      # packages. Pack therefore rebuilds with it too (no --no-build), as windows-release.yml does.
      - name: Build
        shell: bash
        working-directory: windows
        run: dotnet build -c Release "-p:Version=$VERSION" "src/Ambysto.Kit.${PACKAGE}/Ambysto.Kit.${PACKAGE}.csproj"

      # The safety and process tests need the Windows test machine and ran there before the tag; only the license tests run here.
      - name: Test (license)
        if: ${{ env.PACKAGE == 'License' }}
        shell: bash
        working-directory: windows
        run: dotnet test -c Release "-p:Version=$VERSION" tests/Ambysto.Kit.License.Tests/Ambysto.Kit.License.Tests.csproj

      - name: Pack
        shell: bash
        working-directory: windows
        run: dotnet pack "src/Ambysto.Kit.${PACKAGE}/Ambysto.Kit.${PACKAGE}.csproj" -c Release "-p:Version=$VERSION" -o ../artifacts

      - name: What is published
        shell: bash
        run: |
          echo "package $PACKAGE $VERSION from $(git rev-parse HEAD)"
          sha512sum "artifacts/Ambysto.Kit.$PACKAGE.$VERSION.nupkg" | cut -c1-32

      # The nuget.org user name that owns the packages (the profile name, not the e-mail address).
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: Ambysto

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/Ambysto.Kit.$PACKAGE.$VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols
